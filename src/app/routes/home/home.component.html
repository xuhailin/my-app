<div class="article-box">
  <div class="article-recent">
    <div class="article" *ngFor="let item of articles">
      <div class="article-publication-meta">
        Article
        <span class="time">
          {{ item.date }}
        </span>
      </div>
      <div class="article-title" [routerLink]="['/topic', item.file]">
        <h2>{{ item.title }}</h2>
      </div>
      <div class="article-content">
        <h5>{{ item.description }}</h5>
      </div>
      <div class="article-footer">
        <strong *ngFor="let tag of item.tags">{{tag}}</strong>
      </div>
    </div>
    <section class="article-more"
      (click)="gotoArticles()"><span>更多</span></section>
  </div>

  <div class="effect-css">
    <show-css></show-css>
  </div>
</div>
