<mat-list>
  <ng-container *ngFor="let item of articles">
    <mat-list-item>
      <mat-icon matListIcon
        [style.color]="item.iconColor">{{item.icon}}</mat-icon>
      <div class="article" [routerLink]="['/topic', item.file]">
        <h3 matLine>{{item.title}}</h3>
        <p matLine>{{item.description}}</p>
        <p matLine>{{item.date}}</p>
      </div>
    </mat-list-item>

    <mat-divider></mat-divider>
  </ng-container>
</mat-list>
