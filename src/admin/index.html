<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>博客管理后台</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <script src="sveltia-cms.js"></script>
  <style>
    /* 主题配色：与站点一致的 Indigo 主色 + Pink 强调色（Material 3 token 覆盖，尽力增强） */
    :root {
      --md-sys-color-primary: #3f51b5;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #e8eaf6;
      --md-sys-color-on-primary-container: #1a237e;
      --md-sys-color-secondary: #e52e71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #fce4ec;
      --md-sys-color-on-secondary-container: #880e4f;
    }
    html, body {
      margin: 0;
      min-height: 100vh;
    }
    /* 加载中的品牌占位：Sveltia 挂载后自动被应用覆盖 */
    #brand-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #fff;
      z-index: -1;
    }
    #brand-loading .brand-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(to top left, #ff8a00, #e52e71);
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(229, 46, 113, .25);
    }
    #brand-loading .brand-name {
      font-size: 15px;
      color: #5f6368;
      letter-spacing: .5px;
    }
    #brand-loading .brand-tip {
      font-size: 12px;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <div id="brand-loading">
    <div class="brand-mark">H</div>
    <div class="brand-name">博客管理后台</div>
    <div class="brand-tip">正在加载编辑器…首次进入请使用 GitHub 访问令牌登录（见 CMS-SETUP.md）</div>
  </div>
</body>
</html>
